name: OSS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and bundle Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  persistence:
    name: SQLite and local D1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  package:
    name: Installed package and plugin isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:package

  browser:
    name: Browser and deployed-build request counts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADMIN_EMAILS: editor@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=2
      - run: pnpm test:e2e:media-performance --workers=1 --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: media-performance-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
